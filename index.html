<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 동네 숨은 맛집</title>
<style>
  :root {
    color-scheme: light;
    --bg: #fff8f1;
    --surface: #ffffff;
    --text: #2b2118;
    --muted: #7a6a5c;
    --line: #f0e1d2;
    --field-line: #e3cdb8;
    --accent: #d9480f;
    --accent-hover: #bf3f0c;
    --accent-soft: #fff1e6;
    --star: #f08c00;
    --star-off: #ddcdbd;
    --danger: #c92a2a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  .page {
    max-width: 600px;
    margin: 0 auto;
    padding: 24px 16px 56px;
  }

  h1 {
    margin: 0 0 4px;
    color: var(--accent);
    font-size: 1.75rem;
    line-height: 1.25;
  }
  .sub { margin: 0 0 20px; color: var(--muted); }

  h2 { margin: 0 0 12px; font-size: 1.125rem; }

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px 16px;
    box-shadow: 0 2px 8px rgba(120, 70, 20, 0.06);
  }

  .field { margin-bottom: 16px; }
  label { display: block; margin-bottom: 6px; font-weight: 600; }
  .req { margin-left: 4px; color: var(--accent); font-size: 0.8125rem; font-weight: 600; }
  .opt { margin-left: 4px; color: var(--muted); font-size: 0.8125rem; font-weight: 400; }

  input[type="text"], select {
    display: block;
    width: 100%;
    min-height: 46px;
    padding: 10px 12px;
    border: 1px solid var(--field-line);
    border-radius: 10px;
    background: #fff;
    color: var(--text);
    font: inherit;
  }
  input[type="text"]:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(217, 72, 15, 0.18);
  }
  [aria-invalid="true"] { border-color: var(--danger) !important; }

  .meta {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    min-height: 1.25rem;
    margin-top: 4px;
    font-size: 0.8125rem;
  }
  .error { color: var(--danger); }
  .count { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .count.over { color: var(--danger); font-weight: 600; }

  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }

  .btn {
    min-height: 46px;
    padding: 0 20px;
    border: 1px solid transparent;
    border-radius: 10px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary { min-width: 120px; background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }

  .status { min-height: 1.5rem; margin: 10px 0 0; font-size: 0.9375rem; color: var(--accent); text-align: right; }
  .status.is-error { color: var(--danger); }

  .banner {
    margin: 0 0 16px;
    padding: 10px 12px;
    border: 1px solid #f3c1c1;
    border-radius: 10px;
    background: #fff0f0;
    color: var(--danger);
    font-size: 0.9375rem;
  }

  .list-section { margin-top: 28px; }
  .list-section h2 .count-total { margin-left: 4px; color: var(--muted); font-size: 0.9375rem; font-weight: 400; }

  .empty {
    margin: 0;
    padding: 28px 16px;
    border: 1px dashed var(--field-line);
    border-radius: 16px;
    color: var(--muted);
    text-align: center;
  }

  .cards { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; }

  .card {
    padding: 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 5px solid var(--accent);
    border-radius: 14px;
    box-shadow: 0 2px 8px rgba(120, 70, 20, 0.06);
  }
  .card-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
  .card-title { margin: 0; font-size: 1.125rem; overflow-wrap: anywhere; }
  .stars { font-size: 1.0625rem; letter-spacing: 1px; white-space: nowrap; }
  .stars .on { color: var(--star); }
  .stars .off { color: var(--star-off); }
  .card-menu { margin: 6px 0 0; color: var(--muted); overflow-wrap: anywhere; }
  .card-menu .tag {
    display: inline-block;
    margin-right: 6px;
    padding: 0 8px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 0.8125rem;
    font-weight: 600;
  }
  .card-review { margin: 10px 0 0; overflow-wrap: anywhere; }
  .card-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; }
  .card-date { color: var(--muted); font-size: 0.8125rem; }

  .btn-delete {
    min-height: 40px;
    padding: 0 14px;
    border: 1px solid var(--field-line);
    border-radius: 10px;
    background: #fff;
    color: var(--muted);
    font: inherit;
    font-size: 0.9375rem;
    cursor: pointer;
  }
  .btn-delete:hover { border-color: var(--danger); color: var(--danger); }

  :focus-visible { outline: 3px solid var(--star); outline-offset: 2px; }

  @media (max-width: 480px) {
    .actions .btn-primary { flex: 1; }
  }
</style>
</head>
<body>
<main class="page">
  <header>
    <h1>우리 동네 숨은 맛집</h1>
    <p class="sub">가본 맛집을 잊지 않게 기록해 두세요.</p>
  </header>

  <noscript><p class="banner">이 앱은 JavaScript가 켜져 있어야 동작해요.</p></noscript>
  <p id="storage-error" class="banner" role="alert" hidden></p>

  <section class="panel" aria-labelledby="form-title">
    <h2 id="form-title">맛집 추가</h2>
    <form id="add-form" novalidate>
      <div class="field">
        <label for="name">식당 이름<span class="req">필수</span></label>
        <input id="name" type="text" autocomplete="off" aria-describedby="name-error name-count">
        <div class="meta"><span id="name-error" class="error"></span><span id="name-count" class="count">0/30</span></div>
      </div>

      <div class="field">
        <label for="menu">메뉴<span class="opt">선택</span></label>
        <input id="menu" type="text" autocomplete="off" aria-describedby="menu-error menu-count">
        <div class="meta"><span id="menu-error" class="error"></span><span id="menu-count" class="count">0/30</span></div>
      </div>

      <div class="field">
        <label for="rating">별점<span class="req">필수</span></label>
        <select id="rating" aria-describedby="rating-error">
          <option value="">선택</option>
          <option value="1">★ 1점</option>
          <option value="2">★★ 2점</option>
          <option value="3">★★★ 3점</option>
          <option value="4">★★★★ 4점</option>
          <option value="5">★★★★★ 5점</option>
        </select>
        <div class="meta"><span id="rating-error" class="error"></span></div>
      </div>

      <div class="field">
        <label for="review">한줄평<span class="opt">선택</span></label>
        <input id="review" type="text" autocomplete="off" aria-describedby="review-error review-count">
        <div class="meta"><span id="review-error" class="error"></span><span id="review-count" class="count">0/100</span></div>
      </div>

      <div class="actions">
        <button type="submit" class="btn btn-primary">추가</button>
      </div>
      <p id="form-status" class="status" role="status"></p>
    </form>
  </section>

  <section class="list-section" aria-labelledby="list-title">
    <h2 id="list-title">등록된 맛집<span id="total" class="count-total"></span></h2>
    <p id="empty" class="empty" hidden>아직 등록된 맛집이 없어요.<br>위에서 첫 맛집을 추가해 보세요.</p>
    <ul id="list" class="cards"></ul>
  </section>
</main>

<script>
(() => {
  'use strict';

  const STORAGE_KEY = 'restaurants';
  const LIMITS = { name: 30, menu: 30, review: 100 };

  // ---------- 저장소 ----------
  // 2단계에서 이 구역(listRestaurants / addRestaurant / removeRestaurant)만 Supabase 호출로 바꾼다.
  // 기록은 restaurants 표와 같은 열(id, name, menu, rating, review, created_at)로 저장한다.

  function readStore() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return [];
    let data;
    try { data = JSON.parse(raw); } catch { return []; }
    if (!Array.isArray(data)) return [];
    return data
      .filter((r) => r && typeof r.id === 'string' && typeof r.name === 'string'
        && Number.isInteger(r.rating) && r.rating >= 1 && r.rating <= 5
        && typeof r.created_at === 'string')
      .map((r) => ({
        id: r.id,
        name: r.name,
        menu: typeof r.menu === 'string' ? r.menu : '',
        rating: r.rating,
        review: typeof r.review === 'string' ? r.review : '',
        created_at: r.created_at,
      }));
  }

  function writeStore(list) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }

  function newId() {
    return (window.crypto && crypto.randomUUID)
      ? crypto.randomUUID()
      : Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  }

  async function listRestaurants() {
    return readStore().sort((a, b) => (a.created_at < b.created_at ? 1 : a.created_at > b.created_at ? -1 : 0));
  }

  async function addRestaurant({ name, menu, rating, review }) {
    const record = { id: newId(), name, menu, rating, review, created_at: new Date().toISOString() };
    const all = readStore();
    all.unshift(record);
    writeStore(all);
    return record;
  }

  async function removeRestaurant(id) {
    writeStore(readStore().filter((r) => r.id !== id));
  }

  // ---------- 화면 요소 ----------
  const $ = (id) => document.getElementById(id);
  const form = $('add-form');
  const list = $('list');
  const emptyMsg = $('empty');
  const totalEl = $('total');
  const statusEl = $('form-status');
  const bannerEl = $('storage-error');

  const fields = {};
  for (const key of ['name', 'menu', 'rating', 'review']) {
    fields[key] = { input: $(key), error: $(key + '-error'), count: $(key + '-count') };
  }

  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text; // 사용자가 쓴 글은 항상 textContent로만 넣는다
    return node;
  };

  // Supabase 표(char_length)와 같은 기준으로 글자 수를 센다
  const charLength = (s) => Array.from(s).length;

  // ---------- 입력 검사 ----------
  function readForm() {
    return {
      name: fields.name.input.value.trim(),
      menu: fields.menu.input.value.trim(),
      rating: Number(fields.rating.input.value) || 0,
      review: fields.review.input.value.trim(),
    };
  }

  function validateField(key, values) {
    if (key === 'name') {
      if (charLength(values.name) === 0) return '식당 이름을 입력해 주세요.';
      if (charLength(values.name) > LIMITS.name) return `식당 이름은 ${LIMITS.name}자 이하로 적어 주세요.`;
    } else if (key === 'menu') {
      if (charLength(values.menu) > LIMITS.menu) return `메뉴는 ${LIMITS.menu}자 이하로 적어 주세요.`;
    } else if (key === 'rating') {
      if (!(Number.isInteger(values.rating) && values.rating >= 1 && values.rating <= 5)) return '별점을 선택해 주세요.';
    } else if (key === 'review') {
      if (charLength(values.review) > LIMITS.review) return `한줄평은 ${LIMITS.review}자 이하로 적어 주세요.`;
    }
    return '';
  }

  function showFieldError(key, message) {
    const f = fields[key];
    f.error.textContent = message;
    if (message) f.input.setAttribute('aria-invalid', 'true');
    else f.input.removeAttribute('aria-invalid');
  }

  function updateCount(key) {
    const f = fields[key];
    if (!f.count) return;
    const n = charLength(f.input.value.trim());
    f.count.textContent = `${n}/${LIMITS[key]}`;
    f.count.classList.toggle('over', n > LIMITS[key]);
  }

  for (const key of Object.keys(fields)) {
    const f = fields[key];
    const onChange = () => {
      updateCount(key);
      if (f.input.getAttribute('aria-invalid') === 'true') showFieldError(key, validateField(key, readForm()));
    };
    f.input.addEventListener(key === 'rating' ? 'change' : 'input', onChange);
  }

  // ---------- 알림 ----------
  let statusTimer;
  function setStatus(message, isError = false) {
    clearTimeout(statusTimer);
    statusEl.textContent = message;
    statusEl.classList.toggle('is-error', isError);
    if (message && !isError) statusTimer = setTimeout(() => { statusEl.textContent = ''; }, 2500);
  }

  function setBanner(message) {
    bannerEl.textContent = message;
    bannerEl.hidden = !message;
  }

  // ---------- 목록 그리기 ----------
  const dateFormat = new Intl.DateTimeFormat('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });

  function renderCard(r) {
    const li = el('li', 'card');

    const head = el('div', 'card-head');
    head.append(el('h3', 'card-title', r.name));
    const stars = el('span', 'stars');
    stars.setAttribute('role', 'img');
    stars.setAttribute('aria-label', `별점 5점 중 ${r.rating}점`);
    stars.append(el('span', 'on', '★'.repeat(r.rating)), el('span', 'off', '★'.repeat(5 - r.rating)));
    head.append(stars);
    li.append(head);

    if (r.menu) {
      const menu = el('p', 'card-menu');
      menu.append(el('span', 'tag', '메뉴'), document.createTextNode(r.menu));
      li.append(menu);
    }
    if (r.review) li.append(el('p', 'card-review', r.review));

    const foot = el('div', 'card-foot');
    const date = new Date(r.created_at);
    foot.append(el('span', 'card-date', isNaN(date) ? '' : dateFormat.format(date)));
    const del = el('button', 'btn-delete', '삭제');
    del.type = 'button';
    del.setAttribute('aria-label', `${r.name} 삭제`);
    del.addEventListener('click', async () => {
      try {
        await removeRestaurant(r.id);
      } catch {
        setBanner('삭제하지 못했어요. 브라우저의 저장 기능을 확인해 주세요.');
        return;
      }
      await refresh();
    });
    foot.append(del);
    li.append(foot);

    return li;
  }

  async function refresh() {
    let items = [];
    try {
      items = await listRestaurants();
      setBanner('');
    } catch {
      setBanner('이 브라우저에서는 기록을 불러올 수 없어요. 브라우저의 저장 기능이 꺼져 있는지 확인해 주세요.');
    }
    list.replaceChildren(...items.map(renderCard));
    emptyMsg.hidden = items.length > 0;
    totalEl.textContent = items.length ? `${items.length}곳` : '';
  }

  // ---------- 추가 ----------
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const values = readForm();

    let firstInvalid = null;
    for (const key of ['name', 'menu', 'rating', 'review']) {
      const message = validateField(key, values);
      showFieldError(key, message);
      if (message && !firstInvalid) firstInvalid = fields[key].input;
    }
    if (firstInvalid) {
      setStatus('입력한 내용을 확인해 주세요.', true);
      firstInvalid.focus();
      return;
    }

    try {
      await addRestaurant(values);
    } catch {
      setStatus('저장하지 못했어요. 브라우저의 저장 공간을 확인해 주세요.', true);
      return;
    }
    form.reset();
    for (const key of Object.keys(fields)) { showFieldError(key, ''); updateCount(key); }
    setStatus('맛집을 추가했어요.');
    await refresh();
  });

  // 다른 탭에서 바뀌어도 목록을 맞춘다
  window.addEventListener('storage', (event) => {
    if (event.key === STORAGE_KEY || event.key === null) refresh();
  });

  refresh();
})();
</script>
</body>
</html>
