<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 동네 숨은 맛집</title>
<style>
  /* 디자인: DESIGN-mobbin.md (갤러리 화이트 모노크롬, 알약 버튼, 그림자 없음) */
  :root {
    color-scheme: light;
    --ink: #141414;
    --ink-soft: #262626;
    --muted: #707070;
    --faint: #adadad;
    --canvas: #ffffff;
    --canvas-soft: #f3f3f3;
    --field: #f0f0f0;
    --hairline-soft: #f0f0f0;
    --hairline: #e0e0e0;
    --error: #c4281c; /* 입력 오류를 알리는 기능용 색. 장식에는 쓰지 않는다 */
    --r-sm: 16px;
    --r-md: 24px;
    --r-full: 9999px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--canvas);
    color: var(--ink);
    font-family: "Saans", "Inter", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    font-size: 16px;
    font-weight: 456;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    flex: 1;
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    padding: 32px 16px 80px;
  }

  /* 상단: 로고 타일 + 큰 제목 + 가벼운 부제 */
  .hero { padding: 16px 0 40px; }
  .logomark {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 48px;
    height: 48px;
    margin-bottom: 24px;
    border-radius: 30%;
    background: var(--ink);
    color: #fff;
  }
  .logomark svg { width: 26px; height: 26px; }
  h1 {
    margin: 0 0 16px;
    font-size: clamp(2.25rem, 9vw, 3.5rem);
    font-weight: 650;
    line-height: 1.15;
    letter-spacing: 0;
  }
  .sub { margin: 0; color: var(--muted); font-size: 1.25rem; font-weight: 300; line-height: 1.5; }

  h2 { margin: 0 0 24px; font-size: 1.5rem; font-weight: 650; line-height: 1.25; letter-spacing: 0; }

  /* 입력 카드 */
  .panel {
    background: var(--canvas);
    border: 1px solid var(--hairline);
    border-radius: var(--r-md);
    padding: 24px;
  }

  .field { margin-bottom: 20px; }
  label { display: block; margin-bottom: 8px; font-size: 0.875rem; font-weight: 600; }
  .req {
    margin-left: 8px;
    padding: 1px 8px;
    border-radius: var(--r-full);
    background: var(--canvas-soft);
    color: var(--ink);
    font-size: 0.75rem;
    font-weight: 600;
  }
  .opt { margin-left: 8px; color: var(--muted); font-size: 0.75rem; font-weight: 456; }

  /* 입력칸: 테두리 없이 옅은 회색 채움. 포커스 때만 잉크색 링 */
  input[type="text"], select {
    display: block;
    width: 100%;
    min-height: 52px;
    padding: 12px 16px;
    border: 0;
    border-radius: var(--r-sm);
    background-color: var(--field);
    color: var(--ink);
    font: inherit;
  }
  select {
    appearance: none;
    -webkit-appearance: none;
    padding-right: 44px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23141414' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");
    background-repeat: no-repeat;
    background-position: right 16px center;
  }
  input[type="text"]:focus, select:focus { outline: 2px solid var(--ink); outline-offset: 0; }
  input[type="text"][aria-invalid="true"], select[aria-invalid="true"],
  input[type="text"][aria-invalid="true"]:focus, select[aria-invalid="true"]:focus { outline: 2px solid var(--error); outline-offset: 0; }

  .meta {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    min-height: 1.25rem;
    margin-top: 6px;
    font-size: 0.75rem;
  }
  .error { color: var(--error); font-weight: 600; }
  .count { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .count.over { color: var(--error); font-weight: 600; }

  /* 버튼은 전부 알약 모양 */
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }

  .btn {
    min-height: 48px;
    padding: 0 24px;
    border: 1px solid transparent;
    border-radius: var(--r-full);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .btn:disabled { opacity: 0.5; cursor: progress; }
  .btn-primary { min-width: 120px; background: var(--ink); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--ink-soft); }
  .btn-secondary { background: var(--canvas); border-color: var(--hairline); color: var(--ink); }
  .btn-secondary:hover:not(:disabled) { background: var(--canvas-soft); }

  .status { min-height: 1.5rem; margin: 12px 0 0; color: var(--ink-soft); font-size: 0.875rem; text-align: right; }
  .status.is-error { color: var(--error); font-weight: 600; }

  .banner {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 12px;
    margin: 0 0 24px;
    padding: 12px 16px;
    border-radius: var(--r-sm);
    background: var(--canvas-soft);
    color: var(--ink);
    font-size: 0.875rem;
  }
  .banner[hidden] { display: none; }
  .btn-retry {
    min-height: 36px;
    padding: 0 16px;
    border: 1px solid var(--hairline);
    border-radius: var(--r-full);
    background: var(--canvas);
    color: var(--ink);
    font: inherit;
    font-size: 0.875rem;
    font-weight: 600;
    cursor: pointer;
  }

  /* 맛집 목록 */
  .list-section { margin-top: 64px; }
  .list-section h2 { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .count-total {
    padding: 2px 12px;
    border-radius: var(--r-full);
    background: var(--canvas-soft);
    font-size: 0.8125rem;
    font-weight: 600;
  }
  .count-total:empty { display: none; }

  .empty {
    margin: 0;
    padding: 48px 24px;
    border-radius: var(--r-md);
    background: var(--canvas-soft);
    color: var(--muted);
    text-align: center;
  }

  .cards { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; }

  .card {
    padding: 24px;
    background: var(--canvas);
    border: 1px solid var(--hairline);
    border-radius: var(--r-md);
  }
  .card-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
  .card-title { margin: 0; font-size: 1.25rem; font-weight: 650; line-height: 1.3; overflow-wrap: anywhere; }
  .stars { font-size: 1rem; letter-spacing: 2px; white-space: nowrap; }
  .stars .on { color: var(--ink); }
  .stars .off { color: var(--faint); }
  .card-menu { margin: 12px 0 0; color: var(--ink-soft); overflow-wrap: anywhere; }
  .card-menu .tag {
    display: inline-block;
    margin-right: 8px;
    padding: 1px 12px;
    border-radius: var(--r-full);
    background: var(--canvas-soft);
    color: var(--ink);
    font-size: 0.75rem;
    font-weight: 600;
  }
  .card-review { margin: 12px 0 0; overflow-wrap: anywhere; }
  .card-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 20px; }
  .card-date { color: var(--muted); font-size: 0.75rem; }

  .btn-delete {
    min-height: 40px;
    padding: 0 16px;
    border: 1px solid var(--hairline);
    border-radius: var(--r-full);
    background: var(--canvas);
    color: var(--ink);
    font: inherit;
    font-size: 0.875rem;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-delete:hover:not(:disabled) { background: var(--canvas-soft); }
  .btn-delete:disabled { opacity: 0.5; cursor: progress; }

  /* 맨 아래: 잉크색 띠, 위쪽 모서리만 둥글게 */
  .footer {
    padding: 48px 16px 56px;
    border-radius: var(--r-md) var(--r-md) 0 0;
    background: var(--ink);
    color: #fff;
  }
  .footer-inner { max-width: 640px; margin: 0 auto; }
  .footer-brand { margin: 0 0 8px; font-size: 2rem; font-weight: 650; line-height: 1.15; }
  .footer-note { margin: 0; color: var(--faint); font-size: 0.875rem; }

  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  @media (max-width: 480px) {
    .page { padding: 24px 16px 64px; }
    .panel { padding: 20px 16px; }
    .card { padding: 20px 16px; }
    .actions .btn { flex: 1; padding: 0 12px; }
  }
</style>
</head>
<body>
<main class="page">
  <header class="hero">
    <div class="logomark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 3v5a2.5 2.5 0 0 0 5 0V3"/>
        <path d="M8.5 3v6"/>
        <path d="M8.5 10.5V21"/>
        <path d="M17 21V3c-2.1 1.5-3.2 4-3.2 6.8 0 2.3 1.1 3.7 3.2 3.7"/>
      </svg>
    </div>
    <h1>우리 동네 숨은 맛집.</h1>
    <p class="sub">가본 맛집을 기록하고, 동네 사람들과 함께 보세요.</p>
  </header>

  <noscript><p class="banner">이 앱은 JavaScript가 켜져 있어야 동작해요.</p></noscript>
  <div id="banner" class="banner" role="alert" hidden>
    <span id="banner-text"></span>
    <button type="button" id="banner-retry" class="btn-retry">다시 불러오기</button>
  </div>

  <section class="panel" aria-labelledby="form-title">
    <h2 id="form-title">맛집 추가</h2>
    <form id="add-form" novalidate>
      <div class="field">
        <label for="name">식당 이름<span class="req">필수</span></label>
        <input id="name" type="text" autocomplete="off" aria-describedby="name-error name-count">
        <div class="meta"><span id="name-error" class="error"></span><span id="name-count" class="count">0/30</span></div>
      </div>

      <div class="field">
        <label for="menu">메뉴<span class="opt">선택</span></label>
        <input id="menu" type="text" autocomplete="off" aria-describedby="menu-error menu-count">
        <div class="meta"><span id="menu-error" class="error"></span><span id="menu-count" class="count">0/30</span></div>
      </div>

      <div class="field">
        <label for="rating">별점<span class="req">필수</span></label>
        <select id="rating" aria-describedby="rating-error">
          <option value="">선택</option>
          <option value="1">★ 1점</option>
          <option value="2">★★ 2점</option>
          <option value="3">★★★ 3점</option>
          <option value="4">★★★★ 4점</option>
          <option value="5">★★★★★ 5점</option>
        </select>
        <div class="meta"><span id="rating-error" class="error"></span></div>
      </div>

      <div class="field">
        <label for="review">한줄평<span class="opt">선택</span></label>
        <input id="review" type="text" autocomplete="off" aria-describedby="review-error review-count">
        <div class="meta"><span id="review-error" class="error"></span><span id="review-count" class="count">0/100</span></div>
      </div>

      <div class="actions">
        <button type="button" id="ai-btn" class="btn btn-secondary">AI 한줄평 추천</button>
        <button type="submit" id="submit-btn" class="btn btn-primary">추가</button>
      </div>
      <p id="form-status" class="status" role="status"></p>
    </form>
  </section>

  <section class="list-section" aria-labelledby="list-title">
    <h2 id="list-title">등록된 맛집<span id="total" class="count-total"></span></h2>
    <p id="loading" class="empty">불러오는 중…</p>
    <p id="empty" class="empty" hidden>아직 등록된 맛집이 없어요.<br>위에서 첫 맛집을 추가해 보세요.</p>
    <ul id="list" class="cards"></ul>
  </section>
</main>

<footer class="footer">
  <div class="footer-inner">
    <p class="footer-brand">우리 동네 숨은 맛집</p>
    <p class="footer-note">가본 맛집을 잊지 않게 기록하고, 동네 사람들과 함께 봐요.</p>
  </div>
</footer>

<script>
(() => {
  'use strict';

  const SUPABASE_URL = 'https://leppiltvaejxpodopijj.supabase.co';
  // 공개(publishable) 키라서 브라우저 코드에 있어도 된다. 접근 제한은 restaurants 표의 RLS가 맡는다.
  const SUPABASE_KEY = 'sb_publishable_UThOo1wVFHFNK_HW9kOxsg_WCUzS--i';
  const REQUEST_TIMEOUT_MS = 10000;
  const LIMITS = { name: 30, menu: 30, review: 100 };

  // ---------- 저장소 (Supabase restaurants 표) ----------
  // 이 구역만 저장소와 이야기한다. 화면 쪽 코드는 list/add/removeRestaurant만 부른다.

  async function api(path, { method = 'GET', body, prefer } = {}) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
    try {
      const headers = { apikey: SUPABASE_KEY };
      if (body) headers['Content-Type'] = 'application/json';
      if (prefer) headers.Prefer = prefer;
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
        method,
        headers,
        body: body ? JSON.stringify(body) : undefined,
        signal: controller.signal,
      });
      if (!res.ok) throw new Error(`Supabase ${res.status}`);
      return res.status === 204 ? null : await res.json();
    } finally {
      clearTimeout(timer);
    }
  }

  // 새 기록이 맨 위: 정렬은 서버가 created_at 내림차순으로 해서 준다
  async function listRestaurants() {
    return api('restaurants?select=id,name,menu,rating,review,created_at&order=created_at.desc');
  }

  // id와 created_at은 표가 채운다
  async function addRestaurant({ name, menu, rating, review }) {
    const rows = await api('restaurants', {
      method: 'POST',
      body: { name, menu, rating, review },
      prefer: 'return=representation',
    });
    return rows[0];
  }

  async function removeRestaurant(id) {
    await api(`restaurants?id=eq.${encodeURIComponent(id)}`, { method: 'DELETE' });
  }

  // ---------- AI 한줄평 (Edge Function suggest-review) ----------
  // 함수가 모델 3개를 차례로 시도할 수 있어서 넉넉히 기다린다. AI 키는 함수 쪽 Secrets에만 있다.
  const AI_TIMEOUT_MS = 45000;
  const AI_MAX_CHARS = 40;

  async function suggestReview({ name, menu, rating }) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), AI_TIMEOUT_MS);
    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/suggest-review`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, menu, rating: rating || undefined }), // 별점을 안 골랐으면 보내지 않는다
        signal: controller.signal,
      });
      if (!res.ok) throw new Error(`suggest-review ${res.status}`);
      const data = await res.json();
      const text = typeof data.text === 'string' ? data.text.trim() : '';
      if (!text) throw new Error('empty suggestion');
      return Array.from(text).slice(0, AI_MAX_CHARS).join('');
    } finally {
      clearTimeout(timer);
    }
  }

  // ---------- 화면 요소 ----------
  const $ = (id) => document.getElementById(id);
  const form = $('add-form');
  const submitBtn = $('submit-btn');
  const list = $('list');
  const loadingEl = $('loading');
  const emptyMsg = $('empty');
  const totalEl = $('total');
  const statusEl = $('form-status');
  const bannerEl = $('banner');
  const bannerText = $('banner-text');

  const fields = {};
  for (const key of ['name', 'menu', 'rating', 'review']) {
    fields[key] = { input: $(key), error: $(key + '-error'), count: $(key + '-count') };
  }

  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text; // 사용자가 쓴 글은 항상 textContent로만 넣는다
    return node;
  };

  // Supabase 표(char_length)와 같은 기준으로 글자 수를 센다
  const charLength = (s) => Array.from(s).length;

  // ---------- 입력 검사 ----------
  function readForm() {
    return {
      name: fields.name.input.value.trim(),
      menu: fields.menu.input.value.trim(),
      rating: Number(fields.rating.input.value) || 0,
      review: fields.review.input.value.trim(),
    };
  }

  function validateField(key, values) {
    if (key === 'name') {
      if (charLength(values.name) === 0) return '식당 이름을 입력해 주세요.';
      if (charLength(values.name) > LIMITS.name) return `식당 이름은 ${LIMITS.name}자 이하로 적어 주세요.`;
    } else if (key === 'menu') {
      if (charLength(values.menu) > LIMITS.menu) return `메뉴는 ${LIMITS.menu}자 이하로 적어 주세요.`;
    } else if (key === 'rating') {
      if (!(Number.isInteger(values.rating) && values.rating >= 1 && values.rating <= 5)) return '별점을 선택해 주세요.';
    } else if (key === 'review') {
      if (charLength(values.review) > LIMITS.review) return `한줄평은 ${LIMITS.review}자 이하로 적어 주세요.`;
    }
    return '';
  }

  function showFieldError(key, message) {
    const f = fields[key];
    f.error.textContent = message;
    if (message) f.input.setAttribute('aria-invalid', 'true');
    else f.input.removeAttribute('aria-invalid');
  }

  function updateCount(key) {
    const f = fields[key];
    if (!f.count) return;
    const n = charLength(f.input.value.trim());
    f.count.textContent = `${n}/${LIMITS[key]}`;
    f.count.classList.toggle('over', n > LIMITS[key]);
  }

  for (const key of Object.keys(fields)) {
    const f = fields[key];
    const onChange = () => {
      updateCount(key);
      if (f.input.getAttribute('aria-invalid') === 'true') showFieldError(key, validateField(key, readForm()));
    };
    f.input.addEventListener(key === 'rating' ? 'change' : 'input', onChange);
  }

  // ---------- 알림 ----------
  let statusTimer;
  function setStatus(message, isError = false) {
    clearTimeout(statusTimer);
    statusEl.textContent = message;
    statusEl.classList.toggle('is-error', isError);
    if (message && !isError) statusTimer = setTimeout(() => { statusEl.textContent = ''; }, 2500);
  }

  function setBanner(message) {
    bannerText.textContent = message;
    bannerEl.hidden = !message;
  }

  // ---------- 목록 그리기 ----------
  const dateFormat = new Intl.DateTimeFormat('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });

  function renderCard(r) {
    const li = el('li', 'card');

    const head = el('div', 'card-head');
    head.append(el('h3', 'card-title', r.name));
    const stars = el('span', 'stars');
    stars.setAttribute('role', 'img');
    stars.setAttribute('aria-label', `별점 5점 중 ${r.rating}점`);
    stars.append(el('span', 'on', '★'.repeat(r.rating)), el('span', 'off', '★'.repeat(5 - r.rating)));
    head.append(stars);
    li.append(head);

    if (r.menu) {
      const menu = el('p', 'card-menu');
      menu.append(el('span', 'tag', '메뉴'), document.createTextNode(r.menu));
      li.append(menu);
    }
    if (r.review) li.append(el('p', 'card-review', r.review));

    const foot = el('div', 'card-foot');
    const date = new Date(r.created_at);
    foot.append(el('span', 'card-date', isNaN(date) ? '' : dateFormat.format(date)));
    const del = el('button', 'btn-delete', '삭제');
    del.type = 'button';
    del.setAttribute('aria-label', `${r.name} 삭제`);
    del.addEventListener('click', async () => {
      del.disabled = true;
      try {
        await removeRestaurant(r.id);
      } catch {
        del.disabled = false;
        setBanner('삭제하지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.');
        return;
      }
      await refresh();
    });
    foot.append(del);
    li.append(foot);

    return li;
  }

  // 응답이 겹쳐 돌아와도 가장 마지막에 보낸 요청의 결과만 그린다
  let refreshSeq = 0;
  async function refresh() {
    const seq = ++refreshSeq;
    let items = null;
    try {
      items = await listRestaurants();
    } catch {
      items = null;
    }
    if (seq !== refreshSeq) return;

    loadingEl.hidden = true;
    if (items === null) {
      setBanner('맛집 목록을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.');
      emptyMsg.hidden = true; // 못 불러온 것을 "없다"고 보여 주지 않는다
      return;
    }
    setBanner('');
    list.replaceChildren(...items.map(renderCard));
    emptyMsg.hidden = items.length > 0;
    totalEl.textContent = items.length ? `${items.length}곳` : '';
  }

  $('banner-retry').addEventListener('click', refresh);

  // 다른 사람이 올린 기록이 보이도록, 화면으로 돌아올 때마다 다시 불러온다
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') refresh();
  });

  // ---------- 추가 ----------
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    if (submitBtn.disabled) return;
    const values = readForm();

    let firstInvalid = null;
    for (const key of ['name', 'menu', 'rating', 'review']) {
      const message = validateField(key, values);
      showFieldError(key, message);
      if (message && !firstInvalid) firstInvalid = fields[key].input;
    }
    if (firstInvalid) {
      setStatus('입력한 내용을 확인해 주세요.', true);
      firstInvalid.focus();
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = '추가 중…';
    try {
      await addRestaurant(values);
    } catch {
      setStatus('저장하지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.', true);
      return;
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = '추가';
    }
    form.reset();
    for (const key of Object.keys(fields)) { showFieldError(key, ''); updateCount(key); }
    setStatus('맛집을 추가했어요.');
    await refresh();
  });

  // ---------- AI 한줄평 추천 ----------
  const aiBtn = $('ai-btn');
  aiBtn.addEventListener('click', async () => {
    if (aiBtn.disabled) return;
    const values = readForm();

    // 이름이 비었거나 글자 수를 넘으면 요청하지 않는다
    const nameError = validateField('name', values);
    const menuError = validateField('menu', values);
    showFieldError('name', nameError);
    showFieldError('menu', menuError);
    if (nameError || menuError) {
      setStatus(nameError ? '식당 이름을 먼저 입력해 주세요.' : menuError, true);
      (nameError ? fields.name : fields.menu).input.focus();
      return;
    }

    aiBtn.disabled = true;
    aiBtn.textContent = '추천 중…';
    setStatus('');
    try {
      const text = await suggestReview(values);
      if (readForm().name !== values.name) return; // 기다리는 사이 입력이 바뀌었으면 결과를 쓰지 않는다
      fields.review.input.value = text; // 저장은 하지 않는다. 고친 뒤 [추가]를 눌러야 저장된다
      showFieldError('review', '');
      updateCount('review');
      setStatus('한줄평을 추천했어요. 고쳐서 추가할 수 있어요.');
    } catch {
      setStatus('지금은 추천을 받을 수 없어요. 직접 적어 주세요.', true);
    } finally {
      aiBtn.disabled = false;
      aiBtn.textContent = 'AI 한줄평 추천';
    }
  });

  refresh();
})();
</script>
</body>
</html>
